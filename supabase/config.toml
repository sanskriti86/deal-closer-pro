# ----------------------------------------------------------------------
# Edge function JWT verification.
#
# razorpay-create-order and razorpay-verify-payment are called by the
# browser with a Supabase JWT — verify_jwt = true.
#
# razorpay-webhook is called server-to-server by Razorpay (no JWT).
# Must be false or the gateway rejects every webhook with 401.
# ----------------------------------------------------------------------

[functions.razorpay-create-order]
verify_jwt = true

[functions.razorpay-verify-payment]
verify_jwt = true

[functions.razorpay-webhook]
verify_jwt = false
